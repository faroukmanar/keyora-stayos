global: { scrape_interval: 10s, evaluation_interval: 10s }
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: keyora-api
    metrics_path: /internal/metrics
    authorization: { type: Bearer, credentials: local-only-metrics-token-32-characters }
    static_configs: [{ targets: ["host.docker.internal:4100"] }]
