name: keyora-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keyora_test
      POSTGRES_USER: keyora_owner
      POSTGRES_PASSWORD: keyora-owner-local-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyora_owner -d keyora_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: "no"
